<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>でんしゃ たび preview</title>
<!--
  A phone-sized stand-in for AnkiDroid's study screen: window.ankidroid is stubbed, a fake card back carries the slot,
  and the control strip (tap "▼ preview") answers cards. Each answer swaps the card the way AnkiDroid does: the old
  slot is removed, a new one is added and densha.js runs again. Works from file:// and in headless Chrome.
  URL options: ?dev=1 (data-dev slot), ?strip=0 (strip folded away), ?strip=none (no strip at all),?card=N (first CardID),
  ?garden=URL (another card game on the same card: Kanpeki Garden's _garden.js with its #kg slot, to check they coexist).
  ?desktop=1: desktop Anki with the add-on instead: no window.ankidroid; before each card's densha.js runs, the page
  defines DENSHA_DESKTOP and DENSHA_STORE as the add-on's injected script does (the store is kept in this page's own
  localStorage under "desk:" keys, and pycmd just logs). Use a desktop-sized window, e.g. 1280×800.
-->
<style>
  html, body { margin: 0; height: 100%; }
  body { background: #fdfdfb; color: #222; font: 16px/1.5 "Noto Sans JP", sans-serif; }
  .card { padding: 72px 20px 120px; text-align: center; }
  html.desk body { background: #f5f5f5; }
  html.desk .card { max-width: 720px; margin: 0 auto; padding-top: 48px; font-size: 20px; }
  .q { font-size: 44px; margin: 10px 0 4px; }
  .a { font-size: 22px; color: #c0392b; }
  hr { border: 0; border-top: 1px solid #ddd; margin: 20px 0; }
  .note { font-size: 13px; color: #888; }
  #strip { position: fixed; top: 0; left: 0; right: 0; z-index: 2147483600; font: 13px/1.3 sans-serif; }
  #strip summary { list-style: none; cursor: pointer; padding: 4px 10px; background: #333; color: #fff; width: max-content;
    border-radius: 0 0 8px 0; opacity: .75; }
  #strip .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px; background: #eee; border-bottom: 1px solid #bbb; }
  #strip button, #strip input { font: inherit; padding: 6px 8px; }
  #strip input[type=number] { width: 64px; }
  #log { flex-basis: 100%; color: #555; }
</style>
</head>
<body>
<details id="strip" open>
  <summary>▼ preview</summary>
  <div class="row">
    <button id="answer">こたえる ×</button><input id="n" type="number" min="1" max="500" value="1">
    <label>CardID <input id="cid" type="number" value="1001"></label>
    <button id="dminus">ひ −1</button><button id="dplus">ひ ＋1</button>
    <label><input id="dev" type="checkbox"> data-dev</label>
    <button id="wipe">セーブ けす</button>
    <span id="log"></span>
  </div>
</details>
<div id="card" class="card"></div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var DAY = "densha-preview-day", garden = q.get("garden");
  var desktop = q.get("desktop") === "1";
  if (!desktop) window.ankidroid = { userAction: function () {} };     // what AnkiDroid's study screen defines
  else document.documentElement.classList.add("desk");
  window.pycmdLog = [];
  /** Desktop: what the add-on injects before the card's scripts (see addon/inject.js), with a store kept here. */
  function deskGlobals(id) {
    window.pycmd = function (m) { window.pycmdLog.push(m); };
    window.DENSHA_DESKTOP = { v: 1, card: id };
    window.DENSHA_STORE = {
      getItem: function (k) { return localStorage.getItem("desk:" + k); },
      setItem: function (k, v) { localStorage.setItem("desk:" + k, String(v)); window.pycmd("densha:set:" + JSON.stringify([k, String(v), Date.now()])); },
      removeItem: function (k) { localStorage.removeItem("desk:" + k); window.pycmd("densha:del:" + JSON.stringify([k, Date.now()])); }
    };
  }
  /** The day offset (days) the strip moves; DT_CLOCK gives densha.js the moved time. */
  function offset() { return Number(localStorage.getItem(DAY)) || 0; }
  window.DT_CLOCK = function () { return Date.now() + offset() * 864e5; };
  var cid = document.getElementById("cid"), dev = document.getElementById("dev"), log = document.getElementById("log");
  if (q.get("card")) cid.value = q.get("card");
  dev.checked = q.get("dev") === "1";
  if (q.get("strip") === "0") document.getElementById("strip").open = false;
  if (q.get("strip") === "none") document.getElementById("strip").style.display = "none";   // clean screenshots
  var words = [["山", "やま"], ["川", "かわ"], ["森", "もり"], ["空", "そら"], ["花", "はな"], ["雨", "あめ"], ["石", "いし"]];
  function status() {
    var o = offset();
    log.textContent = "next CardID " + cid.value + (o ? " · day " + (o > 0 ? "+" : "") + o : "");
  }
  /** Show the back of card id: a new slot, and densha.js run again (as on a real card swap). */
  function show(id, done) {
    var w = words[id % words.length], card = document.getElementById("card");
    card.innerHTML = '<div class="note">かんじ の よみ</div><div class="q">' + w[0] + '</div><hr><div class="a">' + w[1] +
      '</div><div id="densha" data-card="' + id + '"' + (dev.checked ? ' data-dev="1"' : "") + '></div>' +
      (garden ? '<div id="kg" data-kg="garden" data-card="' + id + '"></div>' : "");
    var srcs = ["densha.js"].concat(garden ? [garden] : []);
    if (desktop) deskGlobals(id);
    (function load(k) {
      if (k >= srcs.length) { if (done) done(); return; }
      var s = document.createElement("script");
      s.src = srcs[k];
      s.onload = s.onerror = function () { s.remove(); load(k + 1); };
      document.body.appendChild(s);
    })(0);
  }
  /** Answer n cards in a row, each a new CardID. */
  function answer(n) {
    var id = +cid.value || 1;
    (function step(k) {
      cid.value = id + k + 1;
      show(id + k, k + 1 < n ? function () { step(k + 1); } : status);
    })(0);
  }
  document.getElementById("answer").onclick = function () { answer(Math.max(1, +document.getElementById("n").value || 1)); };
  document.getElementById("dminus").onclick = function () { localStorage.setItem(DAY, offset() - 1); status(); };
  document.getElementById("dplus").onclick = function () { localStorage.setItem(DAY, offset() + 1); status(); };
  document.getElementById("wipe").onclick = function () {
    if (confirm("でんしゃ たび の セーブ を けす？")) { localStorage.removeItem("densha-tabi"); localStorage.removeItem("densha-tabi-dev-day"); location.reload(); }
  };
  window.previewAnswer = answer;
  window.previewShow = show;
  show(+cid.value, status);
  cid.value = +cid.value + 1;
  status();
})();
</script>
</body>
</html>
